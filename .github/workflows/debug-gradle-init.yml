name: Debug gradle-init-plugin

on:
  push:
    branches:
      - 'debug/**'
  workflow_dispatch:

env:
  COMMON_MAVEN_ARGS: "-e -B --settings .github/mvn-settings.xml --fail-at-end"
  COMMON_TEST_MAVEN_ARGS: "-Dformat.skip -Denforcer.skip -DskipDocs -Dforbiddenapis.skip -DskipExtensionValidation -DskipCodestartValidation"

jobs:
  initial-build:
    name: Initial JDK 21 Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: ./mvnw -T1C $COMMON_MAVEN_ARGS -Dscalpel.enabled=false -DskipTests -DskipITs -DskipDocs -Dinvoker.skip -Dskip.gradle.tests -Djbang.skip -Dtruststore.skip -Dno-format -Dtcks -Prelocations clean install
      - name: Tar io/quarkus like the real CI does
        run: tar -czf m2-content.tgz -C ~ .m2/repository/io/quarkus
      - uses: actions/upload-artifact@v4
        with:
          name: m2-content
          path: m2-content.tgz
          retention-days: 2

  gradle-init-tests:
    name: gradle-init-plugin tests
    needs: initial-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: m2-content
          path: .
      - name: Extract io/quarkus m2 content
        run: tar -xzf m2-content.tgz -C ~
      - name: Run gradle-init-plugin tests
        run: ./mvnw $COMMON_MAVEN_ARGS $COMMON_TEST_MAVEN_ARGS install -pl devtools/gradle/gradle-init-plugin
      - name: Collect diagnostics
        if: always()
        run: |
          ls -la ~/.m2/repository/io/quarkus/quarkus-bom/999-SNAPSHOT/ || true
          find ~/.m2/repository/io/quarkus -path '*platform-descriptor*' | head -20 || true
          find devtools/gradle/gradle-init-plugin/target/.quarkus -maxdepth 3 | head -50 || true
          cat devtools/gradle/gradle-init-plugin/target/.quarkus/config.yaml || true
          tar -czf diagnostics.tgz \
            devtools/gradle/gradle-init-plugin/build/test-results \
            devtools/gradle/gradle-init-plugin/build/reports \
            devtools/gradle/gradle-init-plugin/build/tmp/test/work/.gradle-test-kit/test-kit-daemon \
            devtools/gradle/gradle-init-plugin/target/.quarkus || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: diagnostics.tgz
          retention-days: 3
